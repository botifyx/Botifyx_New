      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "BotifyX",
      "url": "https://botifyx.in",
      "logo": "https://botifyx.in/logo.png",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-95664-43876",

      },
      "sameAs": [

      ]
    }
  </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "BotifyX",
      "url": "https://botifyx.in",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://botifyx.in/?s={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#00ff9d',
              secondary: '#6366f1',
              base: {
                DEFAULT: '#0a0f14',
                light: '#f8fafc'
              },
              surface: {
                DEFAULT: '#121921',
                light: '#ffffff'
              },
              accent: '#00e5ff'
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'ui-monospace', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --brand-glow: 0 0 20px rgba(0, 255, 157, 0.15);
      scroll-behavior: smooth;
    }

    body {
      background-color: #030708;
      color: #f8fafc;
      overflow-x: hidden;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    }

    [id] {
      scroll-margin-top: 100px;
    }

    .gradient-text {
      background: linear-gradient(135deg, #00ff9d 0%, #00e5ff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      padding-right: 0.1em;
    }

    .saas-card {
      background: rgba(18, 25, 33, 0.4);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 24px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .saas-card:hover {
      border-color: rgba(0, 255, 157, 0.2);
      transform: translateY(-4px);
      box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.5);
    }

    @keyframes subtlePulse {

      0%,
      100% {
        opacity: 0.3;
      }

      50% {
        opacity: 0.6;
      }
    }

    .eco-glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(0, 255, 157, 0.05) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background: #030708;
    }

    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #00ff9d;
    }

    /* Reduce motion preference */
    @media (prefers-reduced-motion: reduce) {

      *,
      ::before,
      ::after {
        animation-delay: -1ms !important;
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        background-attachment: initial !important;
        scroll-behavior: auto !important;
        transition-duration: 0s !important;
        transition-delay: 0s !important;
      }
    }
  </style>

}
