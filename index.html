<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <meta property="og:site_name" content="BotifyX" />
    <meta property="og:title" content="BotifyX — AI-Native Digital Engineering" />
    <meta property="og:description" content="Secure, AI-native platforms engineered for growth and an industry-leading low-carbon footprint." />

    <meta property="og:url" content="https://botifyx.in/" />
    <meta property="og:image" content="/botifyx-logo-full.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@botifyx" />
    <meta name="twitter:title" content="BotifyX — AI-Native Digital Engineering" />
    <meta name="twitter:description" content="Secure, AI-native platforms engineered for growth and an industry-leading low-carbon footprint." />
    <meta name="twitter:image" content="/botifyx-logo-full.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "BotifyX",
        "url": "https://botifyx.in",
        "description": "AI-native digital engineering company building secure platforms with an industry-leading low-carbon footprint.",
        "email": "info@botifyx.in",
        "telephone": "+91-95664-43876",
        "sameAs": [
          "https://www.linkedin.com/company/botifyx",
          "https://wa.me/919566443876",
          "https://x.com/botifyx"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "sales",
          "email": "info@botifyx.in",
          "telephone": "+91-95664-43876",
          "availableLanguage": ["en"]
        }
      }
    </script>
  </head>

  <body>
    <!-- Static boot screen: shown instantly while JS loads, removed by React -->
    <div id="static-boot-loader" style="
      position: fixed;
      inset: 0;
      z-index: 99998;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #030708;
    ">
      <style>
        @keyframes sbl-spin { to { transform: rotate(360deg); } }
        @keyframes sbl-pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
      </style>
      <!-- Orbital ring -->
      <svg width="120" height="120" viewBox="0 0 120 120" style="animation: sbl-spin 4s linear infinite; margin-bottom: 28px;">
        <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(0,255,157,0.08)" stroke-width="1"/>
        <circle cx="60" cy="60" r="52" fill="none" stroke="url(#sbl-g)" stroke-width="2" stroke-dasharray="82 246" stroke-linecap="round" style="filter: drop-shadow(0 0 6px rgba(0,255,157,0.5));"/>
        <defs>
          <linearGradient id="sbl-g" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00ff9d"/>
            <stop offset="50%" stop-color="#00e5ff"/>
            <stop offset="100%" stop-color="#7a6bff"/>
          </linearGradient>
        </defs>
      </svg>
      <!-- Brand name -->
      <span style="
        font-family: 'Space Grotesk', sans-serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.04em;
        background: linear-gradient(135deg, #00ff9d 0%, #00e5ff 55%, #7a6bff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 0 20px rgba(0,255,157,0.3));
      ">BotifyX</span>
      <!-- Tagline -->
      <span style="
        font-family: 'JetBrains Mono', monospace;
        font-size: 9px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(160,179,185,0.5);
        margin-top: 8px;
        animation: sbl-pulse 2s ease-in-out infinite;
      ">Loading systems…</span>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
